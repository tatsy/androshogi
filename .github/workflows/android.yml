name: Android CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # LicenseActivity shows copies of these files from res/raw; fail loudly if they drift.
      - name: Check that the bundled license texts match the repository copies
        run: |
          cmp LICENSE app/src/main/res/raw/license_gpl3.txt
          cmp docs/THIRD_PARTY_NOTICES.md app/src/main/res/raw/third_party_notices.txt

      # タグの付かないビルドは、どのコミットの APK なのかを名前にする。
      # プルリクエストの GITHUB_SHA は一時的なマージコミットのもので、
      # リポジトリのどのコミットも指さないため、提案側の先頭を使う。
      - name: Work out the version name
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "APP_VERSION_NAME=${SHA:0:6}" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          ./gradlew --no-daemon \
            -PappVersionName="${APP_VERSION_NAME}" \
            assembleDebug testDebugUnitTest

      - name: Check debug application ID
        run: |
          package_info=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n '1p')
          if [[ "$package_info" != "package: name='org.androshogi.debug' "* ]]; then
            echo "::error::Unexpected debug application ID: $package_info"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumented-test:
    name: Instrumented tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # The hosted runner has only a few GB free after the NDK, CMake and the
      # system image are installed, and the emulator refuses to start unless it
      # can allocate the AVD's userdata partition (default 6 GB + 20 %).
      # Drop pre-installed toolchains this job never uses.
      - name: Free disk space
        run: |
          for d in "$ANDROID_HOME"/ndk/*; do
            case "$d" in *27.2.12479018) ;; *) sudo rm -rf "$d" ;; esac
          done
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY"/CodeQL
          df -h / | tail -1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # AOSP image: smaller than google_apis and boots faster; the tests
          # do not need Google Play services.
          target: default
          # The test APK is tiny; a 2 GB userdata partition is plenty and keeps
          # the emulator's disk-space check well under what the runner offers.
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
